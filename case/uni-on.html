<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNI+ON — Case Study · miint.s0da</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<style>
:root{--ink:#111;--paper:#FFF4D6;--y:#FFD400;--pk:#FF4FA3;--bl:#3DA5FF;--mut:#555}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.75 system-ui,'Noto Sans KR',sans-serif;word-break:keep-all;background-image:radial-gradient(#0001 1.2px,transparent 1.2px);background-size:22px 22px}
.close{position:fixed;top:14px;right:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--y);font:800 18px/1 system-ui;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
main{max-width:960px;margin:0 auto;padding:72px 24px 96px}
section{margin:0 0 56px}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:24px 26px;margin-bottom:22px}
.sticker{display:inline-block;background:var(--pk);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font:800 12px/1 system-ui;letter-spacing:.06em;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
h1{font:900 clamp(3rem,10vw,6.4rem)/.95 system-ui;margin:22px 0 10px;letter-spacing:-.02em;text-shadow:5px 5px 0 var(--y),5px 5px 0 var(--ink)}
.sub{font-weight:700;font-size:1.1rem;margin:0 0 26px}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px}
.meta div{border:3px solid var(--ink);border-radius:14px;padding:12px;background:var(--y)}
.meta small,h2 small{display:block;font:800 11px/1 system-ui;letter-spacing:.12em;color:var(--mut);margin-bottom:6px}
h2{font:900 1.6rem/1.2 system-ui;margin:0 0 14px}
.ph{border:3px dashed var(--ink);border-radius:14px;padding:44px 16px;text-align:center;font-weight:700;color:var(--mut);background:#fff8}
.muted{color:var(--mut)}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:800}
.flow span{border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.go{display:inline-block;margin-top:10px;background:var(--bl);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:14px 24px;font-weight:900;text-decoration:none;box-shadow:5px 5px 0 var(--ink)}
@media(max-width:700px){.meta{grid-template-columns:1fr 1fr}}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.card{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
</style>
</head>
<body>
<button class="close" type="button" aria-label="닫기" onclick="parent.postMessage({type:'case-close'},'*')">✕</button>
<main>
<section>
  <span class="sticker">CASE STUDY · 01</span>
  <h1>UNI+ON</h1>
  <p class="sub">게임·웹툰·굿즈를 한곳에서 찾는 문화 IP 플랫폼</p>
  <div class="meta">
    <div><small>TYPE</small>브랜드 · 플랫폼</div>
    <div><small>ROLE</small>브랜드 UX</div>
  </div>
</section>
<section class="card"><h2><small>UX RATIONALE</small>왜 이 레이아웃인가</h2>
  <div class="flow"><span>카테고리 탐색</span>→<span>상세</span>→<span>장바구니</span></div>
  </section>
<section class="card">
  <a class="go" href="https://unionverse.vercel.app" target="_blank" rel="noopener">사이트 보기 ↗</a></section>
</main>
</body>
</html>
